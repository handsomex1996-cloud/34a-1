<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🥛 iSachkunde 34a Pro Max — Apple Milk Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background-color: #F5F5F7;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    .bento-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      border-radius: 26px;
    }
    .milk-pill {
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .milk-pill:active { transform: scale(0.97); }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #D2D2D7; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen pb-20 selection:bg-[#E4D9FF]">

  <div id="toastContainer" class="fixed top-4 right-4 z-50 pointer-events-none flex flex-col gap-2 max-w-sm w-[92vw]"></div>

  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/85 border-b border-black/[0.06] px-4 py-3">
    <div class="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#F3EEFF] via-[#FFF3EC] to-[#EDFBF3] border border-black/10 flex items-center justify-center text-xl shadow-xs">🥛</div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight text-[#1D1D1F]">iSachkunde 34a <span class="font-normal text-[#86868B]">Pro Max</span></h1>
            <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-[#F3EEFF] text-[#6E56CF]">Apple Milk Edition</span>
          </div>
          <p class="text-[11px] text-[#86868B]">Überblick & Наглядность • Think Sicher • IHK § 34a</p>
        </div>
      </div>

      <!-- 3 ROLES -->
      <div class="flex items-center bg-[#EFEFF4] p-1 rounded-full border border-black/5 text-xs">
        <button onclick="setRole('ausbilder')" id="role-ausbilder" class="milk-pill px-3.5 py-1.5 font-bold bg-white shadow-xs">👨‍🏫 Ausbilder</button>
        <button onclick="setRole('admin')" id="role-admin" class="milk-pill px-3.5 py-1.5 font-bold text-[#6E6E73]">👔 Администрация</button>
        <button onclick="setRole('student')" id="role-student" class="milk-pill px-3.5 py-1.5 font-bold text-[#6E6E73]">🎓 Ученик</button>
      </div>

      <!-- DEVICE VIEWPORT SELECTOR (Универсальные метки) -->
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center bg-[#EFEFF4] p-0.5 rounded-full text-xs">
          <button onclick="setViewport('desktop')" id="vp-desktop" class="milk-pill px-2.5 py-1 font-bold bg-white">🖥️ Компьютер</button>
          <button onclick="setViewport('tablet')" id="vp-tablet" class="milk-pill px-2.5 py-1 font-bold text-[#6E6E73]">📱 Планшет</button>
          <button onclick="setViewport('mobile')" id="vp-mobile" class="milk-pill px-2.5 py-1 font-bold text-[#6E6E73]">📲 Телефон</button>
        </div>
        <button onclick="triggerFidesVoiceReport()" class="milk-pill px-3.5 py-1.5 text-xs font-bold bg-[#EDFBF3] text-[#1D9E5E] border border-[#CBEBD8] flex items-center gap-1.5">
          <span>🤖 ИИ Fides (Голос)</span>
        </button>
      </div>
    </div>

    <!-- TABS -->
    <div class="max-w-[1440px] mx-auto mt-2.5 flex items-center gap-2 overflow-x-auto custom-scroll pb-1" id="navTabs"></div>
  </header>

  <!-- WORKSPACE -->
  <main id="appContainer" class="max-w-[1440px] mx-auto px-4 pt-5 space-y-6"></main>

  <script>
    const TOPICS = [
      { id: 'bgb', short: 'BGB', name: 'Bürgerliches Gesetzbuch', max: 24 },
      { id: 'stgb', short: 'StGB', name: 'Straf- und Verfahrensrecht', max: 24 },
      { id: 'waffen', short: 'WaffG', name: 'Umgang mit Waffen', max: 14 },
      { id: 'uvv', short: 'UVV', name: 'Unfallverhütungsvorschriften', max: 14 },
      { id: 'menschen', short: 'Psych.', name: 'Umgang mit Menschen', max: 14 },
      { id: 'technik', short: 'Technik', name: 'Sicherheitstechnik', max: 14 },
      { id: 'oeff', short: 'Öff.R', name: 'Recht der öff. Sicherheit', max: 8 },
      { id: 'gewo', short: 'GewO', name: 'Gewerberecht (§34a)', max: 4 },
      { id: 'dsgvo', short: 'DSGVO', name: 'Datenschutzrecht', max: 4 }
    ];

    const MERKVERSE = [
      { term: 'Notwehr (§ 32 StGB)', rhyme: '«Gegenwärtig und rechtswidrig der Angriff droht, Notwehr schützt Leben und schützt das Brot!»', hobby: 'Как в боксе: удар летит прямо сейчас — ставь блок.' },
      { term: 'Besitzdiener (§ 855 BGB)', rhyme: '«Wer auf fremdem Posten steht und nach Weisung Gehorsam fleht, ist Besitzdiener — kein Eigentümer — versteht!»', hobby: 'Как повар на чужой кухне: ножи шефа твои по службе, но хозяйские.' },
      { term: 'Jedermannsfestnahme (§ 127 StPO)', rhyme: '«Frische Tat und Fluchtgefahr — pack den Täter, ist doch klar! Doch nur bei Straftat — nicht bei Parken, sonst wirst du selber dort erwarten!»', hobby: 'Как в CS2: увидел читера на месте — заблокируй до прихода админа (полиции).' },
      { term: 'Waffen im ÖV (§ 42a WaffG)', rhyme: '«Einhandmesser und Schlagstock am Gürtel im Licht, auf offener Straße — das duldet man nicht! Nur im Dienst mit Erlaubnis ist Pflicht.»', hobby: 'Как на автогонках: тюнинг спортивный есть, но по дорогам общего пользования без допуска нельзя.' }
    ];

    const STUDENTS = [
      { id: 1, name: 'Ученик 1 (Али М.)', missed: 8, attempts: [58, 64, 68, 80, 67], topicScores: { bgb: 15, stgb: 10, waffen: 7, uvv: 5, menschen: 6, technik: 7, oeff: 4, gewo: 2, dsgvo: 2 } },
      { id: 2, name: 'Ученик 2 (Олена К.)', missed: 12, attempts: [56, 62, 66, 65, 83], topicScores: { bgb: 18, stgb: 18, waffen: 7, uvv: 10, menschen: 10, technik: 9, oeff: 5, gewo: 3, dsgvo: 3 } },
      { id: 3, name: 'Ученик 3 (Сердар Т.)', missed: 20, attempts: [56, 60, 60, 67, 77], topicScores: { bgb: 19, stgb: 16, waffen: 8, uvv: 9, menschen: 7, technik: 8, oeff: 6, gewo: 2, dsgvo: 2 } },
      { id: 4, name: 'Ученик 4 (Дмитрий В.)', missed: 16, attempts: [54, 60, 65, 69, 77], topicScores: { bgb: 18, stgb: 14, waffen: 9, uvv: 8, menschen: 9, technik: 7, oeff: 6, gewo: 3, dsgvo: 3 } },
      { id: 5, name: 'Ученик 5 (Максим П.)', missed: 4, attempts: [63, 67, 62, 75, 86], topicScores: { bgb: 20, stgb: 20, waffen: 8, uvv: 8, menschen: 8, technik: 11, oeff: 6, gewo: 2, dsgvo: 3 } },
      { id: 6, name: 'Ученик 6 (Карим Х.)', missed: 0, attempts: [75, 75, 81, 86, 101], topicScores: { bgb: 18, stgb: 22, waffen: 12, uvv: 13, menschen: 13, technik: 10, oeff: 7, gewo: 3, dsgvo: 3 } },
      { id: 7, name: 'Ученик 7 (Фархад Р.)', missed: 40, attempts: [65, 61, 59, 68, 68], topicScores: { bgb: 11, stgb: 14, waffen: 9, uvv: 8, menschen: 9, technik: 8, oeff: 4, gewo: 3, dsgvo: 2 } },
      { id: 8, name: 'Ученик 8 (Игорь С.)', missed: 12, attempts: [58, 62, 66, 71, 74], topicScores: { bgb: 17, stgb: 17, waffen: 9, uvv: 7, menschen: 7, technik: 7, oeff: 5, gewo: 3, dsgvo: 2 } },
      { id: 9, name: 'Ученик 9 (Самир А.)', missed: 32, attempts: [54, 61, 71, 70, 66], topicScores: { bgb: 13, stgb: 13, waffen: 9, uvv: 7, menschen: 7, technik: 9, oeff: 4, gewo: 2, dsgvo: 2 } },
      { id: 10, name: 'Ученик 10 (Эмре Ч.)', missed: 8, attempts: [73, 74, 66, 68, 76], topicScores: { bgb: 17, stgb: 18, waffen: 8, uvv: 7, menschen: 7, technik: 9, oeff: 5, gewo: 3, dsgvo: 2 } },
      { id: 11, name: 'Ученик 11 (Анна Б.)', missed: 4, attempts: [74, 81, 81, 84, 92], topicScores: { bgb: 15, stgb: 21, waffen: 11, uvv: 12, menschen: 11, technik: 10, oeff: 6, gewo: 3, dsgvo: 3 } }
    ];

    const EXAMINERS = [
      { name: 'Dr. H. Weber', role: 'Vorsitzender (Recht)', avatar: '👨‍⚖️', q: 'Erklären Sie den Unterschied zwischen Notwehr (§ 32 StGB) und Notstand (§ 34 StGB) an einem Beispiel!' },
      { name: 'M. Kalski', role: 'WaffG & Technik', avatar: '👮‍♂️', q: 'Welche Pflichten haben Sie beim Führen eines Teleskopschlagstocks nach § 42a WaffG?' },
      { name: 'S. Lindner', role: 'Deeskalation (Psych.)', avatar: '👩‍💼', q: 'Ein betrunkener Gast schreit Sie am Einlass an. Wie deeskalieren Sie die Situation?' },
      { name: 'T. Yilmaz', role: 'UVV & DSGVO', avatar: '👷‍♂️', q: 'Was müssen Sie bei einer Videoüberwachung im öffentlichen Raum nach DSGVO beachten?' }
    ];

    let state = {
      role: 'ausbilder',
      viewport: 'desktop',
      activeTab: 'overview',
      compareTopic: 'stgb',
      lessonPlanWeek: 1,
      oralActiveEx: 0,
      selectedStudentId: 1
    };

    function showToast(msg) {
      const c = document.getElementById('toastContainer');
      const d = document.createElement('div');
      d.className = 'pointer-events-auto px-4 py-3 rounded-2xl bg-[#1D1D1F] text-white text-xs font-bold shadow-xl border border-white/10 flex items-center justify-between';
      d.innerHTML = `<span>${msg}</span>`;
      c.appendChild(d);
      setTimeout(() => d.remove(), 3500);
    }

    function triggerFidesVoiceReport() {
      showToast('🤖 ИИ Fides: «Группа готова на 74%. Ученик 7 имеет 40 часов пропусков, рекомендуется устный опрос по § 32 StGB».');
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance('Fides Report: Gruppe ist stabil. Achte auf Uebernachtung und Fehlzeiten bei Student 7.');
        u.lang = 'de-DE';
        window.speechSynthesis.speak(u);
      }
    }

    function setRole(r) {
      state.role = r;
      ['ausbilder', 'admin', 'student'].forEach(role => {
        const btn = document.getElementById('role-' + role);
        if (role === r) btn.className = "milk-pill px-3.5 py-1.5 font-bold bg-white shadow-xs text-[#1D1D1F]";
        else btn.className = "milk-pill px-3.5 py-1.5 font-bold text-[#6E6E73]";
      });
      if (r === 'student') state.activeTab = 'student_dash';
      else if (r === 'admin') state.activeTab = 'admin_dash';
      else state.activeTab = 'overview';
      render();
    }

    function setViewport(vp) {
      state.viewport = vp;
      ['desktop', 'tablet', 'mobile'].forEach(v => {
        const b = document.getElementById('vp-' + v);
        if (b) {
          if (v === vp) b.className = "milk-pill px-2.5 py-1 font-bold bg-white text-[#1D1D1F]";
          else b.className = "milk-pill px-2.5 py-1 font-bold text-[#6E6E73]";
        }
      });
    }

    function setActiveTab(t) {
      state.activeTab = t;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTabs() {
      const nav = document.getElementById('navTabs');
      let tabs = [];
      if (state.role === 'ausbilder') {
        tabs = [
          { id: 'overview', label: '📈 Сводные графики & Успеваемость' },
          { id: 'topics_comp', label: '📊 Сравнение тем & Учеников' },
          { id: 'planner', label: '📋 План & Цели Ausbilder-а' },
          { id: 'merkverse', label: '🧠 Запоминалки & Считалочки' },
          { id: 'oral_sim', label: '🎙️ Авто-Симуляция IHK (Германский устный)' }
        ];
      } else if (state.role === 'admin') {
        tabs = [
          { id: 'admin_dash', label: '👔 Дашборд Руководства (Зритель)' }
        ];
      } else {
        tabs = [
          { id: 'student_dash', label: '🎓 Мой кабинет & Материалы' },
          { id: 'merkverse', label: '🧠 Запоминалки (Считалочки)' },
          { id: 'oral_sim', label: '🎙️ Пробный устный экзамен IHK' }
        ];
      }
      nav.innerHTML = tabs.map(t => `
        <button onclick="setActiveTab('${t.id}')" class="milk-pill px-4 py-2 text-xs font-extrabold whitespace-nowrap ${
          state.activeTab === t.id ? 'bg-[#1D1D1F] text-white shadow-xs' : 'bg-white/90 text-[#6E6E73] border border-black/5'
        }">${t.label}</button>
      `).join('');
    }

    function getAiSuggestionsForTab(tab) {
      if (tab === 'overview') return ["💡 Fides: Ученик 7 пропустил 40 часов — вызовите его к доске.", "💡 Fides: Средний балл класса вырос до 76.", "💡 Fides: Запланируйте пробный тест на четверг."];
      if (tab === 'topics_comp') return ["💡 Fides: StGB требует повтора у всей группы.", "💡 Fides: Сравните Ученика 6 и Ученика 7 для примера.", "💡 Fides: Темы BGB и UVV освоены лучше всего."];
      if (tab === 'planner') return ["💡 Fides: Цель текущей недели выполнена на 80%.", "💡 Fides: Добавьте в план больше практики по § 32.", "💡 Fides: Отправьте домашнее задание в телефон."];
      if (tab === 'merkverse') return ["💡 Fides: Считалочка про Notwehr снижает ошибки вдвое.", "💡 Fides: Ученики лучше запоминают через рифмы.", "💡 Fides: Дайте задание сочинить свой стих."];
      if (tab === 'oral_sim') return ["💡 Fides: Экзамен идёт строго на немецком.", "💡 Fides: 4 прюфера оценивают ответы автоматически.", "💡 Fides: Следите за уверенностью речи."];
      return ["💡 Fides: Инструмент готов к работе.", "💡 Fides: Проверьте посещаемость.", "💡 Fides: Успехов в обучении!"];
    }

    function renderOverview() {
      const suggestions = getAiSuggestionsForTab('overview');
      return `
        <div class="space-y-6 fade-in">
          <div class="bento-card p-5 bg-gradient-to-r from-[#F3EEFF] to-[#FFF3EC] border border-[#DFD3FC]">
            <div class="text-[10px] font-extrabold uppercase text-[#6E56CF]">🤖 AI FIDES ADVISOR // ПОДСКАЗКИ ДЛЯ КЛАССА</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 text-xs font-semibold text-[#1D1D1F]">
              ${suggestions.map(s => `<div class="p-3 rounded-xl bg-white/90 border border-black/5 shadow-2xs">${s}</div>`).join('')}
            </div>
          </div>

          <div class="bento-card p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="text-[10px] font-bold uppercase px-2.5 py-1 rounded-full bg-[#EDFBF3] text-[#1D9E5E]">ОБЩАЯ ДИНАМИКА КЛАССА</span>
                <h2 class="text-lg font-extrabold mt-1">График успеваемости всего класса по попыткам (Versuch 1–5)</h2>
              </div>
              <span class="text-xs font-bold text-[#6E56CF]">Порог сдачи IHK = 60 баллов (50%)</span>
            </div>

            <div class="w-full bg-[#FAFAFC] p-4 rounded-2xl border border-black/5">
              <svg viewBox="0 0 700 220" class="w-full h-auto">
                <rect x="40" y="30" width="620" height="150" fill="#EDFBF3" opacity="0.6" rx="8" />
                <line x1="40" y1="90" x2="660" y2="90" stroke="#30A46C" stroke-dasharray="6 4" stroke-width="2" />
                <text x="50" y="82" class="text-[10px] font-bold fill-[#1D9E5E]">Порог сдачи 50% (60 Пкт.) • Зелёная зона</text>
                <polyline fill="none" stroke="#6E56CF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
                  points="90,140 240,120 390,105 540,75 630,55" />
                ${[
                  {v: 'V1', avg: 62, x: 90, y: 140}, {v: 'V2', avg: 66, x: 240, y: 120},
                  {v: 'V3', avg: 69, x: 390, y: 105}, {v: 'V4', avg: 74, x: 540, y: 75}, {v: 'V5', avg: 79, x: 630, y: 55}
                ].map(p => `
                  <circle cx="${p.x}" cy="${p.y}" r="6" fill="#6E56CF" stroke="#FFFFFF" stroke-width="2" />
                  <text x="${p.x}" y="${p.y - 12}" text-anchor="middle" class="text-xs font-black fill-[#1D1D1F]">${p.avg}p</text>
                  <text x="${p.x}" y="200" text-anchor="middle" class="text-xs font-bold fill-[#86868B]">${p.v}</text>
                `).join('')}
              </svg>
            </div>
          </div>

          <div class="bento-card p-6 space-y-4">
            <h3 class="text-base font-extrabold">Сводная таблица успеваемости класса (11 учеников)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border-collapse">
                <thead>
                  <tr class="border-b border-black/10 text-[#86868B] uppercase font-bold text-[10px]">
                    <th class="py-3 px-3">Ученик</th>
                    <th class="py-3 px-3">Пропуски</th>
                    <th class="py-3 px-3">Попытка V1 ➔ V5</th>
                    <th class="py-3 px-3">Текущий балл</th>
                    <th class="py-3 px-3 text-right">Статус IHK</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-black/5 font-medium">
                  ${STUDENTS.map(s => {
                    const cur = s.attempts[s.attempts.length - 1];
                    const ok = cur >= 60;
                    return `
                      <tr class="hover:bg-[#F5F5F7] transition">
                        <td class="py-3 px-3 font-bold">${s.name}</td>
                        <td class="py-3 px-3"><span class="${s.missed > 30 ? 'text-rose-600 font-bold' : ''}">${s.missed}ч</span></td>
                        <td class="py-3 px-3 text-[#86868B] font-mono">${s.attempts[0]} ➔ <b>${cur}</b></td>
                        <td class="py-3 px-3 font-black text-sm ${ok ? 'text-[#1D9E5E]' : 'text-rose-600'}">${cur} / 120</td>
                        <td class="py-3 px-3 text-right"><span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${ok ? 'bg-[#EDFBF3] text-[#1D9E5E]' : 'bg-rose-50 text-rose-600'}">${ok ? '🟢 Готов' : '🔴 Риск'}</span></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderTopicsComp() {
      const suggestions = getAiSuggestionsForTab('topics_comp');
      const topicObj = TOPICS.find(t => t.id === state.compareTopic) || TOPICS[1];
      return `
        <div class="space-y-6 fade-in">
          <div class="bento-card p-5 bg-gradient-to-r from-[#F3EEFF] to-[#FFF3EC] border border-[#DFD3FC]">
            <div class="text-[10px] font-extrabold uppercase text-[#6E56CF]">🤖 AI FIDES ADVISOR // СРАВНЕНИЕ ТЕМ</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 text-xs font-semibold">
              ${suggestions.map(s => `<div class="p-3 rounded-xl bg-white/90 border border-black/5">${s}</div>`).join('')}
            </div>
          </div>
          <div class="bento-card p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-[10px] font-bold uppercase px-2.5 py-1 rounded-full bg-[#F3EEFF] text-[#6E56CF]">АНАЛИЗ ПО ТЕМАМ И УЧЕНИКАМ</span>
                <h2 class="text-lg font-extrabold mt-1">Сравнение успеваемости по разделам § 34a</h2>
              </div>
              <select onchange="state.compareTopic=this.value; render();" class="px-3.5 py-2 rounded-xl bg-[#F5F5F7] text-xs font-extrabold">
                ${TOPICS.map(t => `<option value="${t.id}" ${t.id === state.compareTopic ? 'selected' : ''}>${t.name} (Макс. ${t.max}p)</option>`).join('')}
              </select>
            </div>
            <div class="space-y-3 pt-2">
              ${STUDENTS.map(s => {
                const pts = s.topicScores[state.compareTopic] || 5;
                const pct = Math.round((pts / topicObj.max) * 100);
                const col = pct >= 50 ? 'bg-[#30A46C]' : 'bg-rose-500';
                return `
                  <div class="p-3 rounded-2xl bg-[#FAFAFC] border border-black/5 flex items-center justify-between gap-4">
                    <div class="w-40 font-bold text-xs truncate">${s.name}</div>
                    <div class="flex-1 bg-gray-200 h-3 rounded-full overflow-hidden">
                      <div class="${col} h-full rounded-full transition-all" style="width: ${pct}%"></div>
                    </div>
                    <div class="w-20 text-right font-black text-xs font-mono">${pts} / ${topicObj.max}p (${pct}%)</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderPlanner() {
      const suggestions = getAiSuggestionsForTab('planner');
      return `
        <div class="space-y-6 fade-in">
          <div class="bento-card p-5 bg-gradient-to-r from-[#F3EEFF] to-[#FFF3EC] border border-[#DFD3FC]">
            <div class="text-[10px] font-extrabold uppercase text-[#6E56CF]">🤖 AI FIDES ADVISOR // ПЛАН И ЦЕЛИ</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 text-xs font-semibold">
              ${suggestions.map(s => `<div class="p-3 rounded-xl bg-white/90 border border-black/5">${s}</div>`).join('')}
            </div>
          </div>
          <div class="bento-card p-6 space-y-4">
            <h2 class="text-lg font-extrabold">Учебный календарь и цели Ausbilder-а</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="p-4 rounded-2xl bg-[#EDFBF3] border border-[#CBEBD8] space-y-2">
                <div class="text-xs font-black text-[#1D9E5E]">🎯 Цель недели</div>
                <p class="text-xs">Разбор BGB и StGB через реальные кейсы охранников.</p>
              </div>
              <div class="p-4 rounded-2xl bg-[#FFF3EC] border border-[#FBD5C0] space-y-2">
                <div class="text-xs font-black text-[#E56B38]">⚠️ Внимание</div>
                <p class="text-xs">Отработать пропуски с Учеником 7.</p>
              </div>
              <div class="p-4 rounded-2xl bg-[#F3EEFF] border border-[#DFD3FC] space-y-2">
                <div class="text-xs font-black text-[#6E56CF]">🤖 Fides Рекомендует</div>
                <p class="text-xs">Запустить симуляцию устного экзамена.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMerkverse() {
      const suggestions = getAiSuggestionsForTab('merkverse');
      return `
        <div class="space-y-6 fade-in">
          <div class="bento-card p-5 bg-gradient-to-r from-[#F3EEFF] to-[#FFF3EC] border border-[#DFD3FC]">
            <div class="text-[10px] font-extrabold uppercase text-[#6E56CF]">🤖 AI FIDES ADVISOR // ЗАПОМИНАЛКИ</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 text-xs font-semibold">
              ${suggestions.map(s => `<div class="p-3 rounded-xl bg-white/90 border border-black/5">${s}</div>`).join('')}
            </div>
          </div>
          <div class="bento-card p-6 space-y-4">
            <h2 class="text-lg font-extrabold">Запоминалки, стишки и считалочки для терминов § 34a</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${MERKVERSE.map(m => `
                <div class="p-5 rounded-2xl bg-[#FAFAFC] border border-black/10 space-y-3 flex flex-col justify-between">
                  <div class="space-y-1">
                    <div class="text-xs font-extrabold text-[#6E56CF]">${m.term}</div>
                    <div class="text-sm font-black italic text-[#1D1D1F] bg-[#F3EEFF]/60 p-3 rounded-xl border border-[#DFD3FC]">${m.rhyme}</div>
                  </div>
                  <div class="text-xs text-[#6E6E73] bg-white p-2.5 rounded-xl border border-black/5"><b>Пример:</b> ${m.hobby}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderOralSim() {
      const suggestions = getAiSuggestionsForTab('oral_sim');
      const ex = EXAMINERS[state.oralActiveEx];
      return `
        <div class="space-y-6 fade-in">
          <div class="bento-card p-5 bg-gradient-to-r from-[#F3EEFF] to-[#FFF3EC] border border-[#DFD3FC]">
            <div class="text-[10px] font-extrabold uppercase text-[#6E56CF]">🤖 AI FIDES ADVISOR // УСТНЫЙ ЭКЗАМЕН</div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2 text-xs font-semibold">
              ${suggestions.map(s => `<div class="p-3 rounded-xl bg-white/90 border border-black/5">${s}</div>`).join('')}
            </div>
          </div>
          <div class="bento-card p-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-[10px] font-bold uppercase px-2.5 py-1 rounded-full bg-[#1D9E5E]">ГЕРМАНСКИЙ УСТНЫЙ ЭКЗАМЕН IHK (MÜNDLICHE PRÜFUNG)</span>
                <h2 class="text-lg font-extrabold mt-1">Симуляция (Строго на немецком языке)</h2>
              </div>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              ${EXAMINERS.map((e, idx) => `
                <div onclick="state.oralActiveEx=${idx}; render();" class="p-4 rounded-2xl border-2 transition cursor-pointer flex flex-col justify-between ${
                  state.oralActiveEx === idx ? 'bg-[#1D1D1F] text-white border-[#6E56CF] shadow-lg scale-[1.01]' : 'bg-[#FAFAFC] border-black/10'
                }">
                  <div class="text-3xl">${e.avatar}</div>
                  <div class="mt-2"><div class="font-black text-xs">${e.name}</div><div class="text-[10px] opacity-80">${e.role}</div></div>
                </div>
              `).join('')}
            </div>
            <div class="p-5 rounded-2xl bg-[#F5F5F7] border border-black/10 space-y-4">
              <div class="flex items-center justify-between">
                <span class="text-xs font-black text-[#6E56CF]">${ex.avatar} ${ex.name} spricht (auf Deutsch):</span>
                <button onclick="speakGermanQuestion('${ex.q}')" class="px-3 py-1 rounded-xl bg-white text-xs font-extrabold border border-black/10">🔊 Озвучить (DE)</button>
              </div>
              <p class="text-base font-bold italic text-[#1D1D1F]">«${ex.q}»</p>
              <textarea rows="3" placeholder="Antworten Sie auf Deutsch..." class="w-full p-3 rounded-xl bg-white border text-xs"></textarea>
              <div class="flex justify-end">
                <button onclick="showToast('Antwort angenommen! Bewertung: 86%')" class="px-5 py-2.5 rounded-xl bg-[#30A46C] text-white text-xs font-black">✔ Abschicken</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdminDash() { return renderOverview(); }
    function renderStudentDash() { return renderOverview(); }
    function speakGermanQuestion(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        window.speechSynthesis.speak(u);
        showToast('Sprachausgabe gestartet!');
      }
    }

    function render() {
      renderTabs();
      const c = document.getElementById('appContainer');
      if (state.activeTab === 'overview') c.innerHTML = renderOverview();
      else if (state.activeTab === 'topics_comp') c.innerHTML = renderTopicsComp();
      else if (state.activeTab === 'planner') c.innerHTML = renderPlanner();
      else if (state.activeTab === 'merkverse') c.innerHTML = renderMerkverse();
      else if (state.activeTab === 'oral_sim') c.innerHTML = renderOralSim();
      else if (state.activeTab === 'admin_dash') c.innerHTML = renderAdminDash();
      else if (state.activeTab === 'student_dash') c.innerHTML = renderStudentDash();
    }

    window.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
