const BANK = [

    topic: "2. Gewerberecht (§ 34a GewO / BewachV)",

    ok: 0

let mode = 'full';
let langMode = 'de';
let nativeLang = 'de';
let sessionQs = [];
let idx = 0;
let picked = null;
let answered = false;
let points = 0;
let timerId = null;
let secLeft = 7200;

let seen = Number(localStorage.getItem('seen_34a_pool') || '0');
document.getElementById('pool-counter').textContent =
  `Fragenpool: ${seen} / 820+ gesehen • Zufällige Reihenfolge aktiv`;

function onNativeLangChange() {
  nativeLang = document.getElementById('native-lang-select').value;
  const cfg = UI_TEXT[nativeLang] || UI_TEXT.de;
  const btnNative = document.getElementById('btn-launch-native');
  if (nativeLang === 'de') {
    btnNative.style.display = 'none';
  } else {
    btnNative.style.display = 'block';
    btnNative.textContent = cfg.launchNative;
  }
}

function chooseMode(m) {
  mode = m;
  document.getElementById('mode-full').classList.toggle('active', m === 'full');
  document.getElementById('mode-quick').classList.toggle('active', m === 'quick');
}

function launch(selectedLangMode) {
  langMode = selectedLangMode;
  nativeLang = document.getElementById('native-lang-select').value;
  const count = mode === 'quick' ? Math.min(18, BANK.length) : BANK.length;
  sessionQs = [...BANK].sort(() => Math.random() - 0.5).slice(0, count);
  idx = 0;
  picked = null;
  answered = false;
  points = 0;
  secLeft = mode === 'quick' ? 1560 : 7200;

  seen = Math.min(820, seen + count);
  localStorage.setItem('seen_34a_pool', String(seen));
  document.getElementById('pool-counter').textContent =
    `Fragenpool: ${seen} / 820+ gesehen • Zufällige Reihenfolge aktiv`;

  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('done-view').style.display = 'none';
  document.getElementById('exam-view').style.display = 'block';

  runTimer();
  renderQ();
}

function runTimer() {
  clearInterval(timerId);
  paintTimer();
  timerId = setInterval(() => {
    secLeft--;
    paintTimer();
    if (secLeft <= 0) {
      clearInterval(timerId);
      finish();
    }
  }, 1000);
}

function paintTimer() {
  const m = String(Math.floor(secLeft / 60)).padStart(2, '0');
  const s = String(secLeft % 60).padStart(2, '0');
  document.getElementById('q-timer').textContent = `${m}:${s}`;
}

function renderQ() {
  const q = sessionQs[idx];
  const useExtra = langMode === 'native' && nativeLang !== 'de' && q[nativeLang];
  const extraData = useExtra ? q[nativeLang] : null;
  const cfg = UI_TEXT[nativeLang] || UI_TEXT.de;

  picked = null;
  answered = false;

  document.getElementById('q-step').textContent = `${idx + 1} / ${sessionQs.length}`;
  document.getElementById('q-topic').textContent = q.topic;
  document.getElementById('q-de').textContent = q.de;

  const trEl = document.getElementById('q-tr');
  if (extraData) {
    trEl.style.display = 'block';
    trEl.textContent = extraData.q;
  } else {
    trEl.style.display = 'none';
    trEl.textContent = '';
  }

  const wrap = document.getElementById('q-opts');
  wrap.innerHTML = '';
  q.optsDe.forEach((oDe, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.onclick = () => pickOpt(i);
    const extraOpt = extraData && extraData.opts[i] ? `<span class="opt-tr">${extraData.opts[i]}</span>` : '';
    b.innerHTML = `<strong>${String.fromCharCode(65 + i)})</strong> ${oDe}${extraOpt}`;
    wrap.appendChild(b);
  });

  const exp = document.getElementById('q-exp');
  exp.className = 'exp';
  exp.textContent = extraData ? `${q.expDe} — ${extraData.exp}` : q.expDe;

  document.getElementById('btn-check').style.display = 'block';
  document.getElementById('btn-check').textContent = cfg.check;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-next').textContent = cfg.next;
}

function pickOpt(i) {
  if (answered) return;
  picked = i;
  document.querySelectorAll('.opt').forEach((el, k) => el.classList.toggle('picked', k === i));
}

function submitAnswer() {
  if (answered || picked === null) return;
  answered = true;
  const q = sessionQs[idx];
  if (picked === q.ok) points++;

  document.querySelectorAll('.opt').forEach((el, k) => {
    el.classList.remove('picked');
    if (k === q.ok) el.classList.add('ok');
    else if (k === picked) el.classList.add('bad');
  });

  const exp = document.getElementById('q-exp');
  exp.classList.add('show');
  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = 'block';
}

function goNext() {
  if (idx + 1 < sessionQs.length) {
    idx++;
    renderQ();
  } else {
    finish();
  }
}

function finish() {
  clearInterval(timerId);
  document.getElementById('exam-view').style.display = 'none';
  document.getElementById('done-view').style.display = 'block';

  const name = document.getElementById('student-name').value.trim() || 'Max Mustermann';
  const slot = document.getElementById('start-slot').value;
  const pct = Math.round((points / sessionQs.length) * 100);

  document.getElementById('done-title').textContent = `${name} — ${pct}% (${points}/${sessionQs.length})`;
  document.getElementById('done-summary').textContent =
    `Start: ${slot} • Modus: ${mode === 'quick' ? 'Schnelltraining' : 'Vollständige IHK-Prüfung'}`;
}

function shareReport() {
  const text = encodeURIComponent(
    `${document.getElementById('done-title').textContent}\n${document.getElementById('done-summary').textContent}`
  );
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

function backToStart() {
  clearInterval(timerId);
  document.getElementById('exam-view').style.display = 'none';
  document.getElementById('done-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
}

onNativeLangChange();
</script>
</body>
</html>
